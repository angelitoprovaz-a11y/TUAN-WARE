<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - EcoVida</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>EcoVida: realiza tu pedido</h1>
        <p>Elige productos que ayuden a crear mejores hábitos.</p>
    </header>

    <nav>
    		<a href="index.html">
    	    	<button type="button">Inicio</button>
    		</a>

    		<a href="producto.html">
        	<button type="button">Producto</button>
    		</a>

    		<a href="beneficios.html">
       		 <button type="button">Beneficios</button>
    		</a>

    		<a href="contacto.html">
        	<button type="button">Contacto</button>
    		</a>

   		 <a href="pedido.html">
       		 <button type="button">Pedidos</button>
    		</a>
	</nav>


    <main>
        <section>
            <h2>Solicita tu botella reutilizable</h2>

            <img src="imagenes/botella.jpg"
                 alt="Botella reutilizable EcoVida"
                 width="300">

            <p>
                Completa el formulario con tus datos
                y la información del producto que deseas.
            </p>
        </section>

        <section id="pedido">
            <h2>Formulario de pedido</h2>

            <form action="#" method="get">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre"
                       name="nombre" required>

                <br><br>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo"
                       name="correo" required>

                <br><br>

                <label for="cantidad">Cantidad de botellas:</label>
                <input type="number" id="cantidad"
                       name="cantidad" min="1"
                       value="1" required>

                <br><br>

                <label for="color">Color preferido:</label>
                <select id="color" name="color" required>
                    <option value="">Selecciona un color</option>
                    <option value="verde">Verde</option>
                    <option value="azul">Azul</option>
                    <option value="negro">Negro</option>
                    <option value="blanco">Blanco</option>
                </select>

                <br><br>

                <label for="direccion">Dirección de entrega:</label>
                <textarea id="direccion" name="direccion"
                          rows="3" required></textarea>

                <br><br>

                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios" name="comentarios"
                          rows="4"></textarea>

                <br><br>

                <button type="submit">Enviar pedido</button>
            </form>
        </section>

        <section>
		<center>
            		<h2>Explora EcoVida</h2>
            		<a href="index.html">
                	     <button type="button">Volver al inicio</button>
            		</a>
           		<a href="beneficios.html">
                             <button type="button">Ver beneficios</button>
            		</a>
            		<a href="pedido.html">
                	     <button type="button">Solicitar pedido</button>
            		</a>
               </center>
        </section>

    </main>

    <footer>
        <center>
           <p>&copy; 2026 EcoVida. Todos los derechos reservados.</p>
        </center>

    </footer>

</body>
</html>
